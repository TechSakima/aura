# Firebase App Hosting — Cloud Run defaults for Next.js + image work
runConfig:
  cpu: 1
  memoryMiB: 2048
  maxInstances: 10
  minInstances: 0
  concurrency: 80

# Public Firebase web config (safe to commit). Needed so Next can inline
# NEXT_PUBLIC_* into the client bundle on App Hosting builds.
env:
  - variable: NEXT_PUBLIC_FIREBASE_API_KEY
    value: AIzaSyAOkOwmJ4IRTtH9Heyeqk97oKPHCIph72Q
    availability:
      - BUILD
      - RUNTIME
  - variable: NEXT_PUBLIC_FIREBASE_AUTH_DOMAIN
    value: aura-photo-manager.firebaseapp.com
    availability:
      - BUILD
      - RUNTIME
  - variable: NEXT_PUBLIC_FIREBASE_PROJECT_ID
    value: aura-photo-manager
    availability:
      - BUILD
      - RUNTIME
  - variable: NEXT_PUBLIC_FIREBASE_STORAGE_BUCKET
    value: aura-photo-manager.firebasestorage.app
    availability:
      - BUILD
      - RUNTIME
  - variable: NEXT_PUBLIC_FIREBASE_MESSAGING_SENDER_ID
    value: "749593075452"
    availability:
      - BUILD
      - RUNTIME
  - variable: NEXT_PUBLIC_FIREBASE_APP_ID
    value: 1:749593075452:web:34866da88623a13b188179
    availability:
      - BUILD
      - RUNTIME
  - variable: NEXT_PUBLIC_FIREBASE_MEASUREMENT_ID
    value: G-3KMMV4KHGZ
    availability:
      - BUILD
      - RUNTIME
  - variable: FIREBASE_PROJECT_ID
    value: aura-photo-manager
    availability:
      - BUILD
      - RUNTIME
  - variable: FIREBASE_STORAGE_BUCKET
    value: aura-photo-manager.firebasestorage.app
    availability:
      - BUILD
      - RUNTIME
  - variable: NEXT_PUBLIC_APP_URL
    value: https://aura.stroburm.app
    availability:
      - BUILD
      - RUNTIME
  - variable: RESEND_FROM_EMAIL
    value: Aura <notify@aura.stroburm.app>
    availability:
      - RUNTIME
  - variable: RESEND_API_KEY
    secret: RESEND_API_KEY
    availability:
      - RUNTIME
  # Inbound receiving (docs/RESEND.md Tier 3) + outbox cron (Tier 2)
  # Free Resend: one domain — receive on the same host used for sending (no inbound. subdomain).
  - variable: RESEND_INBOUND_DOMAIN
    value: aura.stroburm.app
    availability:
      - RUNTIME
  - variable: RESEND_WEBHOOK_SECRET
    secret: RESEND_WEBHOOK_SECRET
    availability:
      - RUNTIME
  - variable: CRON_SECRET
    secret: CRON_SECRET
    availability:
      - RUNTIME
  - variable: STRIPE_SECRET_KEY
    secret: STRIPE_SECRET_KEY
    availability:
      - RUNTIME
  - variable: STRIPE_WEBHOOK_SECRET
    secret: STRIPE_WEBHOOK_SECRET
    availability:
      - RUNTIME
  # HMAC / seal (AURA-389) — required in production (backs session + media/homepage/Google fallbacks):
  #   firebase apphosting:secrets:set AURA_SESSION_SECRET --data-file -
  # Optional dedicated secrets (add bindings when created): MEDIA_PROXY_SECRET,
  # HOMEPAGE_UNLOCK_SECRET, GOOGLE_TOKEN_SECRET
  - variable: AURA_SESSION_SECRET
    secret: AURA_SESSION_SECRET
    availability:
      - RUNTIME
  # Cloudflare R2 (AURA-358) — secrets via:
  #   firebase apphosting:secrets:set R2_ACCOUNT_ID --data-file -
  #   firebase apphosting:secrets:set R2_ACCESS_KEY_ID --data-file -
  #   firebase apphosting:secrets:set R2_SECRET_ACCESS_KEY --data-file -
  - variable: R2_ACCOUNT_ID
    secret: R2_ACCOUNT_ID
    availability:
      - RUNTIME
  - variable: R2_ACCESS_KEY_ID
    secret: R2_ACCESS_KEY_ID
    availability:
      - RUNTIME
  - variable: R2_SECRET_ACCESS_KEY
    secret: R2_SECRET_ACCESS_KEY
    availability:
      - RUNTIME
  - variable: R2_BUCKET
    value: aura-media
    availability:
      - RUNTIME
