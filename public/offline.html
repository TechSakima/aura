<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, viewport-fit=cover"
    />
    <meta name="theme-color" content="#1c1915" />
    <title>Offline</title>
    <style>
      :root {
        color-scheme: light dark;
      }
      body {
        margin: 0;
        min-height: 100dvh;
        display: flex;
        align-items: center;
        justify-content: center;
        padding: max(1.5rem, env(safe-area-inset-top))
          max(1.5rem, env(safe-area-inset-right))
          max(1.5rem, env(safe-area-inset-bottom))
          max(1.5rem, env(safe-area-inset-left));
        font-family: Georgia, "Times New Roman", serif;
        background: #f3efe6;
        color: #1c1915;
      }
      main {
        max-width: 20rem;
        text-align: center;
      }
      h1 {
        margin: 0;
        font-size: 1.75rem;
        font-weight: 500;
        letter-spacing: -0.02em;
      }
      p {
        margin: 0.75rem 0 0;
        font-family: system-ui, sans-serif;
        font-size: 0.9375rem;
        line-height: 1.45;
        color: #5c574e;
      }
      button {
        margin-top: 1.5rem;
        min-height: 2.75rem;
        min-width: 2.75rem;
        padding: 0 1.25rem;
        border: 1px solid #1c1915;
        border-radius: 0.375rem;
        background: #1c1915;
        color: #f3efe6;
        font: inherit;
        font-family: system-ui, sans-serif;
        font-size: 0.875rem;
        cursor: pointer;
      }
    </style>
  </head>
  <body>
    <main>
      <h1>You’re offline</h1>
      <p>Reconnect, then try again.</p>
      <button type="button" onclick="location.reload()">Retry</button>
    </main>
  </body>
</html>
